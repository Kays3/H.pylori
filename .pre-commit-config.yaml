# Guards against committing participant data or credentials.
# Install once per clone:
#     pip install pre-commit && pre-commit install
# Run over the whole tree at any time:
#     pre-commit run --all-files
#
# See docs/ethics.md for why these are mandatory rather than advisory.

repos:
  - repo: local
    hooks:
      - id: no-patient-data
        name: block participant-level data
        entry: scripts/check_no_patient_data.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.(csv|tsv|bib)$
      - id: check-merge-conflict
      - id: check-yaml
